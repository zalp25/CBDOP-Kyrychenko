@if (service.error(); as error) {
  <div class="error">
    <span>Помилка: {{ error }}</span>
    <button (click)="service.load()">Спробувати ще раз</button>
    <button (click)="service.closeError()">Закрити</button>
  </div>
}
<h1>ТАБЛИЦЯ ВСІХ ПЕРСОНАЖІВ</h1>
@if (service.loading()) {
  <p>Завантаження...</p>
} @else {
  <app-characters-table />
}
<hr>
<h1>ТАБЛИЦЯ УЛЮБЛЕНИХ ПЕРСОНАЖІВ</h1>
<app-favorites />
<app-character-popup />
<app-graphics />
