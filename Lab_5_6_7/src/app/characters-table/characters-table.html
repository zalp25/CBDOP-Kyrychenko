<label>
  Сортування:
  <select (change)="changeSort($any($event.target).value)">
    @for (s of strategies; track s.title; let i = $index) {
      <option [value]="i">{{ s.title }}</option>
    }
  </select>
</label>
<table>
  <thead>
    <tr>
      <th>Вибране</th>
      <th>Повне ім'я</th>
      <th>Нікнейм</th>
      <th>Факультет</th>
      <th>Дата народження</th>
    </tr>
  </thead>
  <tbody>
    @for (c of rows(); track c.index) {
      <tr (click)="service.selected.set(c)">
        <td class="checkbox-cell">
            <input type="checkbox"
                [checked]="service.isFavorite(c)"
                (click)="$event.stopPropagation(); service.toggleFavorite(c)">
        </td>
        <td>{{ c.fullName }}</td>
        <td>{{ c.nickname }}</td>
        <td>{{ c.hogwartsHouse }}</td>
        <td>{{ c.birthdate }}</td>
      </tr>
    } @empty {
      <tr><td colspan="5">Немає даних</td></tr>
    }
  </tbody>
</table>
